<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1DE9B6" />
    <meta name="robots" content="noindex" />
    <title>Bible Scout has been retired</title>
    <link rel="icon" type="image/png" href="media/bible-scout-192x192.png" sizes="192x192" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #263238;
            color: #eceff1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 32rem;
            padding: 2rem 1rem;
            text-align: center;
        }

        img {
            width: 96px;
            height: 96px;
        }

        h1 {
            color: #1DE9B6;
            font-weight: 500;
        }

        a {
            color: #1DE9B6;
        }
    </style>
</head>

<body>
    <main>
        <img src="media/bible-scout-192x192.png" alt="Bible Scout logo">
        <h1>Bible Scout has been retired</h1>
        <p>
            Bible Scout was retired in November 2026 and no longer loads Bible text or audio.
        </p>
        <p>
            Thank you to everyone who used it to read through the Scriptures.
            The <a href="https://www.navigators.org/resource/bible-reading-plans/">Discipleship Journal Bible Reading Plan</a>
            is still a great way to keep going.
        </p>
        <p>
            The source code remains on <a href="https://github.com/ericop/bible-scout-app">GitHub</a>.
        </p>
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                registrations.forEach(function (registration) { registration.unregister() })
            })
        }
    </script>
</body>

</html>
